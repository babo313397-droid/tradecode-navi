<style>
:root{
  --navy:#082b49;--navy2:#061f36;--gold:#d8a526;--bg:#f4f6f8;
  --grid:#222;--tab:#f3f3f3;--tabline:#0e8a54;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);font-family:"Malgun Gothic","Apple SD Gothic Neo",Arial,sans-serif;color:#111}
button,input,select{font:inherit}
button{cursor:pointer}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:258px;background:linear-gradient(180deg,var(--navy2),var(--navy));padding:22px 15px;overflow:auto;z-index:30}
.side-brand{display:flex;align-items:center;gap:10px;color:#fff;font-weight:900;font-size:17px;margin-bottom:18px}
.logo-badge{width:38px;height:38px;border-radius:10px;background:var(--gold);color:#08253f;display:grid;place-items:center;font-weight:1000}
.side-brand small{font-size:11px;font-weight:500;color:#c8d4df}
.nav-section-label{font-size:10.5px;color:#8fa6ba;margin:14px 8px 7px;font-weight:900;letter-spacing:.08em}
.nav-btn{display:block;width:100%;text-align:left;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);color:#e8eef4;border-radius:10px;padding:12px;font-size:13px;font-weight:800;margin-bottom:7px;text-decoration:none}
.nav-btn.active{background:var(--gold);color:#08253f;border-color:var(--gold)}
.main{margin-left:258px;min-height:100vh;padding:10px}
.toolbar{background:#fff;border:1px solid #cdd3d8;padding:7px 9px;display:flex;gap:7px;align-items:center;flex-wrap:wrap;font-size:12px}
.btn{border:1px solid #b8c0c7;background:#fff;border-radius:4px;padding:6px 10px;font-weight:800}
.btn-primary{background:#0b5186;color:#fff;border-color:#0b5186}
.btn-complete{background:#16864c;color:#fff;border-color:#16864c}
.btn-danger{background:#fff0f0;color:#a62020}
.file-input{display:none}
.title-display{font-weight:900;color:#12334c;margin-left:4px}
.spacer{flex:1}
.status{padding:5px 8px;background:#f7f7f7;border:1px solid #d7d7d7;min-width:250px}
.status.ok{background:#e8f6ed;color:#176b3d}
.status.bad{background:#fff0f0;color:#a52d2d}

/* Excel-like formula/work bar */
.workbar{background:#fafafa;border:1px solid #cfd3d6;border-top:0;padding:6px 8px;display:grid;grid-template-columns:220px 1fr;gap:6px;font-size:12px}
.scanline{display:flex;gap:6px;align-items:center}
.scanline input{width:100%;border:1px solid #9aa5ae;height:30px;padding:4px 7px}
.box-panel{display:grid;grid-template-columns:repeat(7,minmax(90px,1fr));gap:5px}
.box-panel label{font-size:10px;font-weight:800;color:#555}
.box-panel input,.box-panel select{width:100%;height:29px;border:1px solid #aeb8c0;padding:3px 5px;background:#fff}
.current-lines{grid-column:1/-1;border-top:1px solid #ddd;padding-top:5px;display:flex;gap:5px;flex-wrap:wrap}
.line-chip{display:inline-flex;align-items:center;gap:5px;border:1px solid #aaa;background:#fff;padding:4px 6px;font-size:10px}
.line-chip b{max-width:190px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.line-chip button{border:0;background:#eee;padding:1px 4px}

/* workbook */
.book-shell{background:#fff;border:1px solid #aaa;border-top:0;height:calc(100vh - 188px);min-height:560px;display:flex;flex-direction:column}
.sheet-scroll{flex:1;overflow:auto;background:#fff}
.excel{border-collapse:collapse;table-layout:fixed;font-size:13px;font-weight:700;min-width:max-content;background:#fff}
.excel td,.excel th{border:1px solid #222;padding:2px 5px;height:28px;vertical-align:middle;text-align:center;white-space:normal;word-break:keep-all}
.excel .left{text-align:left}
.excel .title-cell{font-size:18px;font-weight:900}
.excel .section-title{background:#FFFF00;font-size:16px;font-weight:900;text-align:left;padding-left:14px}
.excel .head{font-size:14px;font-weight:900;background:#fff}
.excel .subhead{font-size:12px;font-weight:900}
.excel .summary-title{font-size:16px;font-weight:900}
.excel .progress{background:#CCFFFF}
.excel .blank-separator td{height:22px;background:#fff;border-left:0;border-right:0;border-top:2px solid #fff;border-bottom:2px solid #fff}
.excel tr.pending:hover td{background-color:#f2f7ff!important}
.excel tr.pending{cursor:pointer}
.excel tr.selected td{outline:2px solid #2b74c7;outline-offset:-2px}
.excel .group-cell{font-weight:900}
.excel .muted{color:#777}

/* exact-ish column widths */
.order-sheet col.cA{width:128px}.order-sheet col.cB{width:300px}.order-sheet col.cC{width:155px}.order-sheet col.cD{width:105px}.order-sheet col.cE{width:95px}.order-sheet col.cF{width:85px}
.order-sheet col.cG{width:72px}.order-sheet col.cH{width:58px}.order-sheet col.cI{width:58px}.order-sheet col.center{width:72px}.order-sheet col.stock{width:105px}
.center-sheet col.cA{width:120px}.center-sheet col.cB{width:265px}.center-sheet col.cC{width:160px}.center-sheet col.cD{width:150px}.center-sheet col.cE{width:92px}
.center-sheet col.cF{width:85px}.center-sheet col.cG{width:80px}.center-sheet col.cH{width:72px}.center-sheet col.cI{width:72px}.center-sheet col.cJ{width:72px}
.center-sheet col.cK{width:75px}.center-sheet col.cL{width:78px}.center-sheet col.cM{width:78px}.center-sheet col.cN{width:90px}.center-sheet col.cO{width:90px}
.center-sheet col.cP{width:95px}.center-sheet col.cQ{width:95px}.center-sheet col.cR{width:135px}.center-sheet col.cS{width:110px}

.sheet-tabs{display:flex;gap:0;background:#f0f0f0;border-top:1px solid #bbb;overflow:auto;min-height:34px;align-items:end;padding-left:4px}
.sheet-tab{border:0;border-right:1px solid #ccc;background:var(--tab);padding:7px 12px;white-space:nowrap;font-size:12px}
.sheet-tab.active{background:#fff;border-bottom:3px solid var(--tabline);font-weight:900}
.sheet-tab:hover{background:#fff}

.capture-stage{position:fixed;left:-10000px;top:0;background:#fff;padding:0}
.capture-table{border-collapse:collapse;table-layout:fixed;font-family:"Malgun Gothic",Arial,sans-serif;font-size:16px;font-weight:800;background:#fff}
.capture-table td{border:1px solid #111;padding:5px 7px;height:56px;text-align:center;vertical-align:middle;word-break:keep-all}
.capture-table .left{text-align:center}
.sharebar{background:#fffbe8;border:1px solid #e8d58b;border-top:0;padding:5px 8px;font-size:11px;display:flex;align-items:center;gap:7px}
.sharebar.hidden{display:none}
@media(max-width:900px){
  .sidebar{position:static;width:auto;display:flex;padding:8px;gap:5px;overflow:auto}.side-brand,.nav-section-label{display:none}.nav-btn{width:auto;white-space:nowrap;margin:0}
  .main{margin-left:0;padding:4px}.box-panel{grid-template-columns:repeat(2,1fr)}.workbar{grid-template-columns:1fr}.book-shell{height:calc(100vh - 230px)}
}
</style>

<script>
const $=id=>document.getElementById(id);
const DB_NAME='tradecodeInboundExcelV3';
const STORE='jobs';
let db=null,currentJob=null,currentSheet='발주서',selectedItemId='',currentBox=null,lastCompletedBoxId='';
let saveTimer=null;

const COMPANY_ORDER=['코리아원','봄날애','차통 익스프레스'];
const CENTER_COLORS={
  '안성5':'#C5E0B4',
  '안성8':'#F8CBAD',
  '인천47 밀크런':'#FFFF00',
  '인천47     밀크런':'#FFFF00',
  '인천14':'#FFFFFF',
  '안성4':'#BDD7EE',
  '인천28':'#F8CBAD',
  '시흥2':'#C5E0B4'
};
const KNOWN_SHEETS={
  '코리아원|인천14':{name:'인천 14팔레트',type:'pallet'},
  '코리아원|인천47 밀크런':{name:'인천47 밀크런',type:'pallet'},
  '코리아원|인천47     밀크런':{name:'인천47 밀크런',type:'pallet'},
  '코리아원|안성5':{name:'안성 5',type:'parcel'},
  '코리아원|안성8':{name:'안성 8',type:'parcel'},
  '봄날애|안성4':{name:'봄날애 안성4',type:'parcel'},
  '봄날애|인천28':{name:'봄날애 인천28',type:'parcel'},
  '차통 익스프레스|시흥2':{name:'차통시흥2',type:'parcel'}
};

function uid(p='id'){try{return p+'-'+crypto.randomUUID()}catch(e){return p+'-'+Date.now()+'-'+Math.random().toString(16).slice(2)}}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function n(v){const x=Number(v);return Number.isFinite(x)?x:0}
function fmt(v){return Math.round(n(v)).toLocaleString()}
function norm(v){return String(v??'').replace(/\u00a0/g,' ').trim().replace(/\s+/g,' ')}
function barcode(v){
  if(typeof v==='number'&&Number.isFinite(v))return String(Math.trunc(v));
  const s=String(v??'').trim();
  if(/^\d+(\.\d+)?[eE]\+\d+$/.test(s)){
    const x=Number(s);if(Number.isSafeInteger(x))return String(x);
  }
  return s.replace(/\s+/g,'').replace(/\.0$/,'').toUpperCase();
}
function centerKey(company,center){return `${company}|${norm(center)}`}
function rawCenterKey(center){return norm(center)}
function setStatus(msg,type=''){const e=$('scanStatus');e.textContent=msg;e.className='status'+(type?' '+type:'')}
function companyLabel(v){
  const s=norm(v);
  if(s.includes('봄날애'))return '봄날애';
  if(s.includes('차통'))return '차통 익스프레스';
  return '코리아원';
}
function parseTitle(v){
  const s=norm(v);
  const m=s.match(/(\d{1,2})월\s*(\d{1,2})일\s*선적(?:건)?\s*\(\s*(\d{1,2})월\s*(\d{1,2})일\s*쿠팡\s*입고(?:건)?\s*\)/);
  if(!m)return null;
  return `${+m[1]}월 ${+m[2]}일 선적 (${+m[3]}월 ${+m[4]}일 쿠팡 입고)`;
}
function sectionTitle(company,title){
  const date=(title.match(/\d{1,2}월.*$/)||[])[0]||title;
  return `${company} ${date}`;
}
function knownCenter(company,center){
  const c=norm(center);
  let k=centerKey(company,c);
  if(KNOWN_SHEETS[k])return {...KNOWN_SHEETS[k]};
  if(/인천\s*14/.test(c))return {name:'인천 14팔레트',type:'pallet'};
  if(/밀크런|팔레트/.test(c))return {name:(company==='코리아원'?'':company+' ')+c,type:'pallet'};
  const spaced=c.replace(/^(안성)(\d+)$/,'$1 $2');
  return {name:(company==='코리아원'?'':company+' ')+spaced,type:'parcel'};
}
function colorFor(center){
  const c=norm(center);
  return CENTER_COLORS[c]||CENTER_COLORS[c.replace(/\s+/g,' ')]||'#FFFFFF';
}

/* IndexedDB */
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE,{keyPath:'id'})};r.onsuccess=()=>{db=r.result;resolve()};r.onerror=()=>reject(r.error)})}
function putJob(j){return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(j);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
function getJob(id){return new Promise((resolve,reject)=>{const r=db.transaction(STORE).objectStore(STORE).get(id);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function allJobs(){return new Promise((resolve,reject)=>{const r=db.transaction(STORE).objectStore(STORE).getAll();r.onsuccess=()=>resolve(r.result||[]);r.onerror=()=>reject(r.error)})}
function delJob(id){return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).delete(id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
function scheduleSave(){clearTimeout(saveTimer);saveTimer=setTimeout(async()=>{if(currentJob){currentJob.updatedAt=Date.now();await putJob(currentJob);refreshJobs(false)}},200)}

/* 1번 파일 -> workbook model */
function parseFirstWorkbook(wb,fileName){
  const items=[];let company='코리아원',title='',seq=0;
  wb.SheetNames.forEach(sn=>{
    const ws=wb.Sheets[sn];
    const data=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''});
    data.forEach(row=>{
      const a=norm(row[0]);
      const t=parseTitle(a);
      if(t){title=t;company=companyLabel(a);return}
      const pn=norm(row[0]),name=norm(row[1]),bc=barcode(row[2]),center=norm(row[3]),qty=n(row[4]);
      if(pn&&name&&bc&&center&&qty>0){
        const meta=knownCenter(company,center);
        items.push({
          id:uid('item'),seq:++seq,company,productNumber:pn,productName:name,barcode:bc,
          center,centerColor:colorFor(center),sheetName:meta.name,workType:meta.type,orderQty:qty
        });
      }
    });
  });
  if(!items.length)throw new Error('상품번호 / 제품명 / 바코드 / 물류센터 / 발주수량을 찾지 못했습니다.');
  if(!title)title=fileName.replace(/\.(xlsx|xls)$/i,'');
  const centers={};
  items.forEach(x=>{
    if(!centers[x.sheetName])centers[x.sheetName]={name:x.sheetName,company:x.company,type:x.workType,center:x.center,color:x.centerColor};
  });
  return {
    id:uid('job'),title,fileName,createdAt:Date.now(),updatedAt:Date.now(),
    items,centers,boxes:{},nextBoxNo:1
  };
}
function orderedCenters(){
  if(!currentJob)return [];
  const arr=Object.values(currentJob.centers||{});
  const rankCompany=c=>{const i=COMPANY_ORDER.indexOf(c);return i<0?99:i};
  return arr.slice().sort((a,b)=>{
    const ga=a.type==='pallet'?0:1,gb=b.type==='pallet'?0:1;
    if(ga!==gb)return ga-gb;
    const ca=rankCompany(a.company),cb=rankCompany(b.company);
    if(ca!==cb)return ca-cb;
    return a.name.localeCompare(b.name,'ko');
  });
}
function allSheets(){return ['발주서',...orderedCenters().map(x=>x.name)]}
function centerMetaBySheet(name){return currentJob?.centers?.[name]||null}
function sheetItems(name){return (currentJob?.items||[]).filter(x=>x.sheetName===name)}
function boxesFor(name){return currentJob?.boxes?.[name]||[]}
function completedBoxes(name){return boxesFor(name).filter(x=>x.complete).sort((a,b)=>(a.completedAt||a.createdAt)-(b.completedAt||b.createdAt))}
function packedQty(itemId){
  let s=0;
  Object.values(currentJob?.boxes||{}).flat().filter(b=>b.complete).forEach(b=>{
    const mult=(b.type==='pallet'&&b.lines.length===1)?Math.max(1,n(b.boxCount)):1;
    (b.lines||[]).forEach(l=>{if(l.itemId===itemId)s+=n(l.qty)*mult});
  });
  return s;
}
function remainQty(item){return Math.max(0,n(item.orderQty)-packedQty(item.id))}
function centerStats(sheetName){
  const items=sheetItems(sheetName),boxes=completedBoxes(sheetName);
  const order=items.reduce((s,x)=>s+n(x.orderQty),0);
  const packed=items.reduce((s,x)=>s+packedQty(x.id),0);
  const physical=boxes.reduce((s,b)=>s+(b.type==='pallet'?Math.max(1,n(b.boxCount)):1),0);
  const palettes=new Set(boxes.map(b=>norm(b.paletteNo)).filter(Boolean)).size;
  const weight=boxes.reduce((s,b)=>s+n(b.weight)*(b.type==='pallet'?Math.max(1,n(b.boxCount)):1),0);
  return {order,packed,physical,palettes,weight};
}
function totalStats(){
  const order=(currentJob?.items||[]).reduce((s,x)=>s+n(x.orderQty),0);
  let packed=0,physical=0;
  orderedCenters().forEach(c=>{const st=centerStats(c.name);packed+=st.packed;physical+=st.physical});
  return {order,packed,physical};
}

/* render workbook */
function showSheet(name){
  if(!currentJob&&name!=='발주서')return;
  currentSheet=name;selectedItemId='';
  if(currentBox&&currentBox.sheetName!==name)clearCurrentBox(false);
  renderWorkbook();
  setTimeout(()=>$('scanInput')?.focus(),20);
}
function renderWorkbook(){

/* scanning and box building */
function selectItem(id){
  selectedItemId=id;
  const item=currentJob.items.find(x=>x.id===id);
  if(item)setStatus(`${item.productName} 선택 · 남은수량 ${fmt(remainQty(item))}`,'ok');
  renderSheet();renderCurrentBox();
  setTimeout(()=>$('lineQty')?.focus(),20);
}
function scanBarcode(){
  if(!currentJob||currentSheet==='발주서'){setStatus('먼저 센터 시트를 선택해 주세요.','bad');return}
  const bc=barcode($('scanInput').value);if(!bc)return;
  const item=sheetItems(currentSheet).find(x=>barcode(x.barcode)===bc&&remainQty(x)>0);
  $('scanInput').value='';
  if(!item){setStatus(`현재 시트에서 바코드 ${bc}의 미작업 상품을 찾지 못했습니다.`,'bad');return}
  selectItem(item.id);
  const row=$('item-'+item.id);row?.scrollIntoView({block:'nearest'});
}
function ensureCurrentBox(){
  const meta=centerMetaBySheet(currentSheet);
  if(!meta)return null;
  if(!currentBox||currentBox.sheetName!==currentSheet){
    currentBox={id:uid('box'),sheetName:currentSheet,type:meta.type,lines:[],size:'',boxCount:1,weight:'',paletteNo:'',outBoxNo:'',trackingNo:'',createdAt:Date.now()};
  }
  return currentBox;
}
function addSelectedToBox(){
  const item=currentJob?.items.find(x=>x.id===selectedItemId);
  if(!item){setStatus('먼저 바코드를 찍거나 상품 행을 선택해 주세요.','bad');return}
  const box=ensureCurrentBox(),qty=Math.max(1,Math.floor(n($('lineQty').value)||1));
  const remain=remainQty(item);
  const existing=box.lines.find(x=>x.itemId===item.id);
  const already=existing?n(existing.qty):0;
  if(qty+already>remain){if(!confirm(`남은수량 ${fmt(remain)}개보다 현재 박스 입력수량이 많습니다. 계속할까요?`))return}
  if(existing)existing.qty=already+qty;else box.lines.push({itemId:item.id,qty});
  renderCurrentBox();setStatus(`현재 박스에 ${item.productName} ${fmt(qty)}개 추가`,'ok');
  $('scanInput').focus();
}
function renderCurrentBox(){
  const meta=centerMetaBySheet(currentSheet);
  if(!meta){$('currentBoxInfo').textContent='현재 박스: 비어 있음';$('currentLines').innerHTML='';return}
  const box=ensureCurrentBox();
  $('boxCountWrap').style.display=meta.type==='pallet'?'block':'none';
  $('trackingWrap').style.display=meta.type==='parcel'?'block':'none';
  if(!box.lines.length){
    $('currentBoxInfo').textContent='현재 박스: 비어 있음';$('currentLines').innerHTML='';return
  }
  $('currentBoxInfo').textContent=`현재 박스: ${box.lines.length}종 / ${fmt(box.lines.reduce((s,x)=>s+n(x.qty),0))}개`;
  $('currentLines').innerHTML=box.lines.map((l,i)=>{
    const it=currentJob.items.find(x=>x.id===l.itemId);
    return `<span class="line-chip"><b>${esc(it?.productName||'')}</b> ${fmt(l.qty)}개 <button onclick="removeCurrentLine(${i})">×</button></span>`;
  }).join('');
}
function removeCurrentLine(i){if(currentBox){currentBox.lines.splice(i,1);renderCurrentBox()}}
function clearCurrentBox(render=true){
  currentBox=null;selectedItemId='';
  ['boxSize','boxWeight','paletteNo','outBoxNo','trackingNo'].forEach(id=>{if($(id))$(id).value=''});
  if($('boxCount'))$('boxCount').value=1;
  if(render){renderCurrentBox();renderSheet()}
}
function completeCurrentBox(){
  if(!currentJob||currentSheet==='발주서')return;
  const meta=centerMetaBySheet(currentSheet),box=ensureCurrentBox();
  if(!box.lines.length){setStatus('현재 박스에 상품을 먼저 추가해 주세요.','bad');return}
  box.size=norm($('boxSize').value);
  box.boxCount=meta.type==='pallet'?Math.max(1,Math.floor(n($('boxCount').value)||1)):1;
  box.weight=norm($('boxWeight').value);
  box.paletteNo=norm($('paletteNo').value);
  box.outBoxNo=norm($('outBoxNo').value);
  box.trackingNo=meta.type==='parcel'?norm($('trackingNo').value):'';
  if(!box.size){setStatus('박스 사이즈를 입력해 주세요.','bad');$('boxSize').focus();return}
  if(box.lines.length>1&&box.boxCount>1){setStatus('여러 아이템이 한 박스에 들어갈 때 박스수는 1로 입력해 주세요.','bad');return}

  const start=Math.max(1,Math.floor(n(currentJob.nextBoxNo)||1));
  const count=meta.type==='pallet'?box.boxCount:1;
  const end=start+count-1;
  box.boxNo=count===1?String(start):`${start}~${end}`;
  currentJob.nextBoxNo=end+1;
  box.complete=true;box.completedAt=Date.now();

  currentJob.boxes[currentSheet]=currentJob.boxes[currentSheet]||[];
  currentJob.boxes[currentSheet].push({...box});
  lastCompletedBoxId=box.id;
  currentBox=null;selectedItemId='';
  scheduleSave();renderWorkbook();
  setStatus(`✓ 박스 ${box.boxNo} 작업 완료 · 완료 박스가 위로 이동했습니다.`,'ok');
  $('sharebar').classList.remove('hidden');
  $('shareText').textContent=`${currentSheet} · 박스 ${box.boxNo} 완료`;
  setTimeout(()=>captureLastBox(true),100);
}
function findBox(id){
  for(const [sheet,arr] of Object.entries(currentJob?.boxes||{})){

  }
  return null;
}

/* completion capture */

  const widths=[120,260,160,145,90,85,75,210,75,80,75,75,85,85,90,95,95];
  if(meta.type==='parcel')widths.push(135);
  let rows=lines.map((line,i)=>{
    const item=currentJob.items.find(x=>x.id===line.itemId);
    const qty=(box.type==='pallet'&&lines.length===1)?n(line.qty)*Math.max(1,n(box.boxCount)):n(line.qty);
    return `<tr>
      <td>${esc(item.productNumber)}</td><td>${esc(item.productName)}</td><td>${esc(item.barcode)}</td><td style="background:${item.centerColor}">${esc(item.center)}</td><td>${fmt(qty)}</td>
      ${i===0?`<td rowspan="${rs}">${fmt(boxDisplayF(box))}</td><td rowspan="${rs}">${meta.type==='pallet'?fmt(box.boxCount):fmt(completedBoxes(sheetName).findIndex(x=>x.id===box.id)+1)}</td>
      <td rowspan="${rs}" colspan="3">${esc(box.size)}</td><td rowspan="${rs}">${esc(box.paletteNo||'')}</td><td rowspan="${rs}">${esc(box.weight||'')}</td>
      <td rowspan="${rs}"></td><td rowspan="${rs}"></td><td rowspan="${rs}"></td><td rowspan="${rs}">${esc(box.boxNo)}</td><td rowspan="${rs}">${esc(box.outBoxNo||'')}</td>
      ${meta.type==='parcel'?`<td rowspan="${rs}">${esc(box.trackingNo||'')}</td>`:''}`:''}
    </tr>`;
  }).join('');
  return `<table class="capture-table"><colgroup>${widths.map(w=>`<col style="width:${w}px">`).join('')}</colgroup><tbody>${rows}</tbody></table>`;
}
async function blobForBox(sheetName,box){
  const stage=$('captureStage');stage.innerHTML=captureMarkup(sheetName,box);
  const canvas=await html2canvas(stage.firstElementChild,{scale:1.7,backgroundColor:'#fff',logging:false});
  return await new Promise(r=>canvas.toBlob(r,'image/png'));
}
async function captureLastBox(auto=false){
  const found=findBox(lastCompletedBoxId);if(!found)return;
  try{
    const blob=await blobForBox(found.sheet,found.box);
    const fileName=`${found.sheet}_박스_${found.box.boxNo}.png`.replace(/[\\/:*?"<>|]/g,'_');
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fileName;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
    try{
      if(navigator.clipboard&&window.ClipboardItem){
        await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);
        setStatus(`✓ ${fileName} 저장 + 클립보드 복사 완료. 단체 대화방에서 Ctrl+V로 붙여넣을 수 있습니다.`,'ok');
      }
    }catch(e){}
  }catch(e){console.error(e);if(!auto)setStatus('캡쳐 생성에 실패했습니다.','bad')}
}
async function shareLastBox(){
  const found=findBox(lastCompletedBoxId);if(!found)return;
  try{
    const blob=await blobForBox(found.sheet,found.box);
    const file=new File([blob],`${found.sheet}_박스_${found.box.boxNo}.png`,{type:'image/png'});
    if(navigator.share&&(!navigator.canShare||navigator.canShare({files:[file]}))){
      await navigator.share({title:`${found.sheet} 박스 ${found.box.boxNo} 완료`,files:[file]});
    }else{
      await captureLastBox(false);
      alert('이 브라우저는 파일 직접 공유를 지원하지 않습니다. 캡쳐를 클립보드에 복사/저장했으니 단체 대화방에 붙여넣어 주세요.');
    }
  }catch(e){if(e?.name!=='AbortError')console.error(e)}
}

/* file / jobs */
async function handleFile(file){
  try{
    const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
    const job=parseFirstWorkbook(wb,file.name);
    currentJob=job;currentJob.boxes={};currentJob.nextBoxNo=1;
    await putJob(job);await refreshJobs();currentSheet='발주서';currentBox=null;renderWorkbook();
    setStatus(`✓ ${job.title} · ${job.items.length}개 품목 / ${orderedCenters().length}개 물류센터 생성`,'ok');
  }catch(e){console.error(e);setStatus(e.message||'엑셀을 읽지 못했습니다.','bad')}
}
async function refreshJobs(select=true){

  const sel=$('jobSelect');sel.innerHTML=jobs.length?jobs.map(j=>`<option value="${j.id}">${esc(j.title)}</option>`).join(''):'<option value="">저장된 작업 없음</option>';
  if(currentJob&&jobs.some(j=>j.id===currentJob.id))sel.value=currentJob.id;
  if(select&&currentJob)sel.value=currentJob.id;
}

}
async function deleteJob(){
  if(!currentJob)return;if(!confirm(`"${currentJob.title}" 작업을 삭제할까요?`))return;
  await delJob(currentJob.id);currentJob=null;currentSheet='발주서';currentBox=null;
  await refreshJobs();const jobs=await allJobs();if(jobs.length)await loadJob(jobs[0].id);else renderWorkbook();
}
function downloadBackup(){
  if(!currentJob)return;
  const blob=new Blob([JSON.stringify(currentJob,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${currentJob.title}_작업백업.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);
}

$('sourceFile').addEventListener('change',e=>{const f=e.target.files?.[0];if(f)handleFile(f);e.target.value=''});

(async function(){
  await openDB();await refreshJobs();
  const jobs=(await allJobs()).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
  if(jobs.length)await loadJob(jobs[0].id);else renderWorkbook();
  setTimeout(()=>$('scanInput').focus(),100);
})();
</script>
