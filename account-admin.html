<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>계정 관리</title><style>body{font-family:-apple-system,BlinkMacSystemFont,Pretendard,Malgun Gothic,sans-serif;background:#f4f6f9;margin:0;color:#1b2733}.wrap{max-width:900px;margin:40px auto;padding:0 18px}.card{background:white;border:1px solid #dfe5ec;border-radius:14px;padding:20px;margin-bottom:16px}h1{color:#0b2e4f}.grid{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px}input,select,button{padding:10px;border:1px solid #cbd5df;border-radius:8px}button{cursor:pointer;font-weight:800}.primary{background:#0b2e4f;color:white}.row{display:grid;grid-template-columns:1fr 1fr 110px 110px 120px;gap:8px;align-items:center;border-top:1px solid #edf0f3;padding:10px 0}.muted{color:#718096;font-size:12px}@media(max-width:700px){.grid,.row{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>사용자 계정 관리</h1><div class="card"><b>새 계정 만들기</b><div class="grid" style="margin-top:12px"><input id="name" placeholder="표시 이름"><input id="id" placeholder="로그인 아이디"><input id="pw" type="password" placeholder="비밀번호 8자 이상"><button class="primary" onclick="createUser()">계정 추가</button></div><div class="muted" id="msg"></div></div><div class="card"><b>계정 목록</b><div id="list"></div></div><button onclick="location.href='/'">← 사이트로 돌아가기</button></div><script src="/auth-client.js"></script><script>
const $=id=>document.getElementById(id);async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}}),j=await r.json();if(!r.ok)throw new Error(j.error||'오류');return j}async function load(){try{const j=await api('/api/auth/users');$('list').innerHTML=j.users.map(u=>`<div class="row"><b>${u.displayName}<div class="muted">${u.username}${u.legacyOwner?' · 기존 데이터 소유자':''}</div></b><span>${u.role}</span><button onclick="resetPw('${u.id}')">비번 변경</button><button ${u.legacyOwner?'disabled':''} onclick="toggle('${u.id}',${!u.disabled})">${u.disabled?'사용':'중지'}</button><span class="muted">${u.disabled?'중지됨':'정상'}</span></div>`).join('')}catch(e){$('msg').textContent=e.message}}async function createUser(){try{await api('/api/auth/users',{method:'POST',body:JSON.stringify({username:$('id').value,password:$('pw').value,displayName:$('name').value})});$('id').value=$('pw').value=$('name').value='';load()}catch(e){$('msg').textContent=e.message}}async function resetPw(id){const p=prompt('새 비밀번호(8자 이상)');if(!p)return;try{await api('/api/auth/users/'+id,{method:'PATCH',body:JSON.stringify({password:p})});alert('변경했습니다.')}catch(e){alert(e.message)}}async function toggle(id,disabled){try{await api('/api/auth/users/'+id,{method:'PATCH',body:JSON.stringify({disabled})});load()}catch(e){alert(e.message)}}load();
</script></body></html>
