<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>계정 관리</title><style>
body{font-family:-apple-system,BlinkMacSystemFont,Pretendard,Malgun Gothic,sans-serif;background:#f4f6f9;margin:0;color:#1b2733}.wrap{max-width:980px;margin:40px auto;padding:0 18px}.card{background:white;border:1px solid #dfe5ec;border-radius:14px;padding:20px;margin-bottom:16px}h1{color:#0b2e4f}.grid{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px}input,select,button{padding:10px;border:1px solid #cbd5df;border-radius:8px}button{cursor:pointer;font-weight:800}.primary{background:#0b2e4f;color:white}.approve{background:#157347;color:white;border-color:#157347}.row{display:grid;grid-template-columns:minmax(180px,1fr) 90px 110px 110px 110px 120px;gap:8px;align-items:center;border-top:1px solid #edf0f3;padding:10px 0}.muted{color:#718096;font-size:12px}.pending{color:#b26a00;font-weight:900}.ok{color:#157347;font-weight:900}.disabled{color:#b42318;font-weight:900}.notice{margin-top:10px;padding:10px 12px;border-radius:9px;background:#fff7df;color:#7b5700;font-size:12px;line-height:1.6}@media(max-width:800px){.grid,.row{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>사용자 계정 관리</h1><div class="card"><b>새 계정 만들기</b><div class="grid" style="margin-top:12px"><input id="name" placeholder="표시 이름"><input id="id" placeholder="로그인 아이디"><input id="pw" type="password" placeholder="비밀번호 8자 이상"><button class="primary" onclick="createUser()">계정 추가</button></div><div class="notice">새로 만든 계정은 바로 사용할 수 없습니다. 계정 생성 후 아래 목록에서 관리자가 <b>승인</b>해야 로그인할 수 있습니다. 기존 계정은 그대로 사용 가능합니다.</div><div class="muted" id="msg"></div></div><div class="card"><b>계정 목록</b><div id="list"></div></div><button onclick="location.href='/'">← 사이트로 돌아가기</button></div><script src="/auth-client.js"></script><script>
const $=id=>document.getElementById(id);
async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}}),j=await r.json();if(!r.ok)throw new Error(j.error||'오류');return j}
function statusHtml(u){if(u.disabled)return '<span class="disabled">사용중지</span>';if(u.approvalPending)return '<span class="pending">승인 대기</span>';return '<span class="ok">승인 완료</span>'}
async function load(){try{const j=await api('/api/auth/users');$('list').innerHTML=j.users.map(u=>`<div class="row"><b>${u.displayName}<div class="muted">${u.username}${u.legacyOwner?' · 기존 데이터 소유자':''}</div></b><span>${u.role}</span>${statusHtml(u)}<button onclick="resetPw('${u.id}')">비번 변경</button>${u.approvalPending?`<button class="approve" onclick="approve('${u.id}')">승인</button>`:`<button disabled>${u.legacyOwner?'관리자':'승인됨'}</button>`}<button ${u.legacyOwner?'disabled':''} onclick="toggle('${u.id}',${!u.disabled})">${u.disabled?'사용':'중지'}</button></div>`).join('')}catch(e){$('msg').textContent=e.message}}
async function createUser(){try{const j=await api('/api/auth/users',{method:'POST',body:JSON.stringify({username:$('id').value,password:$('pw').value,displayName:$('name').value})});$('id').value=$('pw').value=$('name').value='';$('msg').textContent='계정을 만들었습니다. 아래 목록에서 승인해야 사용할 수 있습니다.';await load()}catch(e){$('msg').textContent=e.message}}
async function approve(id){if(!confirm('이 계정을 승인하시겠습니까? 승인 후 바로 로그인할 수 있습니다.'))return;try{await api('/api/auth/users/'+id,{method:'PATCH',body:JSON.stringify({approved:true})});await load()}catch(e){alert(e.message)}}
async function resetPw(id){const p=prompt('새 비밀번호(8자 이상)');if(!p)return;try{await api('/api/auth/users/'+id,{method:'PATCH',body:JSON.stringify({password:p})});alert('변경했습니다.')}catch(e){alert(e.message)}}
async function toggle(id,disabled){try{await api('/api/auth/users/'+id,{method:'PATCH',body:JSON.stringify({disabled})});load()}catch(e){alert(e.message)}}
load();
</script></body></html>
