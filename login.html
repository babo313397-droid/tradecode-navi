<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TradeCode Navi 로그인</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f6f9;font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Malgun Gothic",sans-serif;color:#172635}.card{width:min(430px,calc(100vw - 32px));background:#fff;border:1px solid #dce5ed;border-radius:18px;padding:28px;box-shadow:0 16px 44px rgba(10,46,79,.12)}.brand{display:flex;gap:12px;align-items:center;margin-bottom:22px}.logo{width:44px;height:44px;border-radius:12px;background:#c99a2e;color:#071f38;display:grid;place-items:center;font-weight:900}.brand b{font-size:21px}.brand small{display:block;color:#73869a;margin-top:3px}.notice{font-size:12px;line-height:1.6;background:#f5f8fb;padding:11px 12px;border-radius:10px;margin-bottom:16px;color:#516679}label{display:block;font-size:12px;font-weight:800;margin:13px 0 5px}input{width:100%;padding:12px;border:1px solid #cbd7e2;border-radius:9px;font-size:15px}button{width:100%;border:0;border-radius:10px;padding:13px;margin-top:18px;background:#0b2e4f;color:#fff;font-weight:900;cursor:pointer}.err{min-height:19px;color:#b42318;font-size:12px;margin-top:10px}.hidden{display:none}</style></head><body><div class="card"><div class="brand"><div class="logo">TC</div><div><b>TradeCode Navi</b><small id="subtitle">로그인</small></div></div><div id="bootstrapNote" class="notice hidden">영구 저장소에 계정 DB가 아직 없습니다. 기존 계정 백업이 발견되지 않은 경우에만 <b>첫 관리자 계정</b>을 한 번 만들어 주세요. 생성 후에는 /var/data 영구 디스크에 저장되어 업데이트 후에도 유지됩니다.</div><div id="storageNote" class="notice hidden" style="background:#fff1f1;color:#9b1c1c"></div><div id="recoveryNote" class="notice hidden" style="background:#fff8e8;color:#7a5311">기존 사용 이력이 확인되어 <b>새 관리자 계정 생성은 차단</b>되어 있습니다. 서버가 기존 계정 데이터를 자동 복구 중입니다. 기존 아이디로 로그인해 주세요.</div><form id="f"><div id="displayWrap" class="hidden"><label>관리자 이름</label><input id="displayName" autocomplete="name" placeholder="예: 관리자"></div><label>아이디</label><input id="username" autocomplete="username" required><label>비밀번호</label><input id="password" type="password" autocomplete="current-password" required><button id="submit">로그인</button><div class="err" id="err"></div></form></div><script>
let bootstrap=false;const $=id=>document.getElementById(id);async function init(){const r=await fetch('/api/auth/me',{cache:'no-store'}),j=await r.json();bootstrap=!!j.needsBootstrap;if(j.authenticated){location.href=new URLSearchParams(location.search).get('next')||'/';return}if(j.storageReady===false){$('subtitle').textContent='영구 저장소 연결 오류';$('storageNote').textContent=j.storageError||'영구 디스크를 사용할 수 없습니다.';$('storageNote').classList.remove('hidden');$('submit').disabled=true;return}if(bootstrap){$('subtitle').textContent='영구 저장소 첫 관리자 계정 만들기';$('bootstrapNote').classList.remove('hidden');$('displayWrap').classList.remove('hidden');$('submit').textContent='관리자 계정 만들기'}else if(j.recoveryRequired){$('subtitle').textContent='계정 저장소 보호 모드';$('recoveryNote').innerHTML='이 서버는 이미 계정을 만든 기록이 있는데 계정 파일을 읽지 못하고 있습니다. <b>새 관리자 생성은 차단</b>되어 있습니다. 관리자에게 저장소 점검을 요청하세요.';$('recoveryNote').classList.remove('hidden');$('submit').textContent='기존 계정으로 로그인'}}
$('f').addEventListener('submit',async e=>{e.preventDefault();$('err').textContent='';$('submit').disabled=true;try{const body={username:$('username').value,password:$('password').value,displayName:$('displayName').value};const r=await fetch(bootstrap?'/api/auth/bootstrap':'/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'처리 실패');location.href=new URLSearchParams(location.search).get('next')||'/'}catch(e){$('err').textContent=e.message}finally{$('submit').disabled=false}});init();
</script></body></html>
